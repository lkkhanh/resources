<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Hunter Minigame</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="minigame-container" style="display: none;">
        <div class="header">
            <h2>BẮT THÚ</h2>
            <div class="progress-text">Thành công: <span id="round-count">0</span> / 10</div>
        </div>
        
        <div class="timer-bar-container">
            <div id="timer-bar"></div>
        </div>

        <div id="arrow-container">
            <!-- Arrows will be injected here -->
        </div>

        <div class="instructions">Bấm các phím mũi tên tương ứng</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
